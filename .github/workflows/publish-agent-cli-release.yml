name: Publish Zed Agent CLI artifact

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful build run ID to package
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: zed-agent-cli-windows-x86_64
          path: artifact
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Package and publish fork release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          case "$SOURCE_RUN_ID" in
            (''|*[!0-9]*) echo 'source_run_id must be numeric' >&2; exit 1;;
          esac
          archive="zed-agent-cli-windows-x86_64-${SOURCE_RUN_ID}.zip"
          (cd artifact && zip -qr "../${archive}" .)
          tag="zed-agent-cli-${SOURCE_RUN_ID}"
          gh release create "$tag" "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Zed Agent CLI build ${SOURCE_RUN_ID}" \
            --notes "Unsigned Windows build containing the Zed Agent CLI patch. Generated from Actions run ${SOURCE_RUN_ID}."
